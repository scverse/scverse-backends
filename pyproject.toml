[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling"]

[project]
name = "scverse-backends"
description = "Pluggable backend dispatch for scverse and scientific Python host libraries"
readme = "README.md"
keywords = ["backend-dispatch", "scverse", "single-cell"]
license = "MIT"
authors = [{ name = "scverse" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

optional-dependencies.dev = [
  "hatch>=1.9",
  "pre-commit>=3",
  "ruff",
  "ty==0.0.34",    # keep aligned with the pre-commit hook while ty is pre-release
]
optional-dependencies.docs = [
  "myst-parser>=2",
  "scanpydoc[theme]>=0.13",
  "sphinx>=7",
  "sphinx-autodoc-typehints>=2",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
]
optional-dependencies.test = ["pytest>=7", "pytest-cov>=4"]

urls."Bug Tracker" = "https://github.com/scverse/scverse-backends/issues"
urls.Documentation = "https://scverse-backends.readthedocs.io"
urls.Source = "https://github.com/scverse/scverse-backends"

[tool.hatch]
build.targets.wheel.packages = ["src/scverse_backends"]
version.source = "vcs"

[tool.ruff]
src = ["src"]
line-length = 88
lint.select = [
  "F",      # Errors detected by Pyflakes
  "E",      # Error detected by Pycodestyle
  "W",      # Warning detected by Pycodestyle
  "I",      # isort
  "TID",    # flake8-tidy-imports
  "C4",     # flake8-comprehensions
  "BLE",    # flake8-blind-except
  "FBT",    # No boolean positional parameters
  "UP",     # pyupgrade
  "TID251", # Banned imports
  "RUF100", # Report unused noqa directives
  "ICN",    # Follow import conventions
  "PTH",    # Pathlib instead of os.path
  "TC",     # manage type checking blocks
]

lint.ignore = [
  # line too long -> we accept long comment lines; formatting gets rid of long code lines
  "E501",
  # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E731",
  # allow I, O, l as variable names -> I is the identity matrix
  "E741",
  # Missing docstring in public package
  "F403",
]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["I"]
"tests/*" = ["D", "FBT"]
"*/__init__.py" = ["F401"]
[tool.ruff.lint.isort]
known-first-party = ["scverse_backends"]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
fail_under = 85
show_missing = true

[tool.codespell]
skip = '*.ipynb,*.csv,docs/_build,docs/generated'
ignore-words-list = "nd"
